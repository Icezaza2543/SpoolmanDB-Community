name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check git whitespace
        run: git diff-tree --check --no-commit-id -r HEAD
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run validation script
        run: python scripts/validate.py
      - name: Check Public ID stability gate
        run: python scripts/compile_id_baseline.py
      - name: Check README snapshot
        run: python scripts/readme_snapshot.py --check
      - name: Run unit tests
        run: python -m pytest tests/
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run display name JavaScript test
        run: node tests/test_display_name.cjs
  compile:
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile filaments
        run: python3 scripts/compile_filaments.py
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate compiled output
        run: python scripts/validate.py
      - name: Check pinned Spoolman compatibility (stable, required)
        run: python scripts/check_spoolman_compat.py --mode stable
      - uses: actions/upload-artifact@v7
        with:
          name: filaments
          path: filaments.json
          if-no-files-found: error

  spoolman-canary:
    # Advisory only: visible diagnostics when master drifts from the stable pin.
    # Failures must not block data PRs (continue-on-error + non-required job).
    runs-on: ubuntu-latest
    needs: [validate]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile filaments
        run: python scripts/compile_filaments.py
      - name: Canary Spoolman compatibility (master, non-blocking)
        id: canary
        run: |
          set +e
          python scripts/check_spoolman_compat.py --mode canary
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "### Spoolman canary: OK" >> "$GITHUB_STEP_SUMMARY"
            echo "No ExternalFilament field/type drift vs stable pin." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Spoolman canary: DRIFT or failure (exit $code)" >> "$GITHUB_STEP_SUMMARY"
            echo "Advisory only — does not fail the required build job." >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python scripts/check_spoolman_compat.py --mode canary --diff-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Surface canary status
        if: steps.canary.outputs.exit_code != '0'
        run: |
          echo "::warning::Spoolman canary reported exit ${{ steps.canary.outputs.exit_code }} (advisory; does not block merge)"

  # Single deploy job since we're just deploying
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [compile]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore artifacts
        uses: actions/download-artifact@v8
        with:
          name: filaments
          path: public
      - name: Copy remaining data
        run: |
          cp materials.json public/
          cp filaments.schema.json public/
          cp filaments.compiled.schema.json public/
          cp materials.schema.json public/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
