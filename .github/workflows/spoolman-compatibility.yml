name: Spoolman Compatibility

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Stable pin (required contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile filaments
        run: python scripts/compile_filaments.py
      - name: Validate compiled output
        run: python scripts/validate.py
      - name: Check stable Spoolman pin
        run: python scripts/check_spoolman_compat.py --mode stable

  canary:
    name: Canary vs master (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile filaments
        run: python scripts/compile_filaments.py
      - name: Validate compiled output
        run: python scripts/validate.py
      - name: Check canary Spoolman master + field drift
        id: canary
        run: |
          set +e
          python scripts/check_spoolman_compat.py --mode canary 2>&1 | tee canary.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### Spoolman canary result (exit $code)"
            echo '```'
            cat canary.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
